# author: jf
name: arb-qa

services:
  mock-ai:
    image: ai-resume-builder-python-ai-backend:latest
    container_name: arb-qa-mock-ai
    working_dir: /qa
    command: ["uvicorn", "mock_server.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MOCK_AI_DEFAULT_SCENARIO: "${MOCK_AI_DEFAULT_SCENARIO:-normal}"
      MOCK_AI_TIMEOUT_DELAY_SECONDS: "${MOCK_AI_TIMEOUT_DELAY_SECONDS:-0.2}"
      MOCK_EMBEDDING_DIMENSIONS: "${MOCK_EMBEDDING_DIMENSIONS:-1024}"
    volumes:
      - ./:/qa:ro
    ports:
      - "127.0.0.1:${QA_MOCK_AI_PORT:-18080}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - qa-network

  mysql:
    image: mysql:8.4
    container_name: arb-qa-mysql
    environment:
      MYSQL_DATABASE: "${QA_MYSQL_DATABASE}"
      MYSQL_ROOT_PASSWORD: "${QA_MYSQL_ROOT_PASSWORD}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${QA_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - qa-mysql-data:/var/lib/mysql
    networks:
      - qa-network

  redis:
    image: redis:7-alpine
    container_name: arb-qa-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - qa-network

  pgvector:
    image: pgvector/pgvector:pg17
    container_name: arb-qa-pgvector
    environment:
      POSTGRES_DB: "${QA_POSTGRES_DB}"
      POSTGRES_USER: "${QA_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${QA_POSTGRES_PASSWORD}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${QA_PGVECTOR_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - qa-pgvector-data:/var/lib/postgresql/data
    networks:
      - qa-network

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: arb-qa-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${QA_MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${QA_MINIO_ROOT_PASSWORD}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${QA_MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${QA_MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - qa-minio-data:/data
    networks:
      - qa-network

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: arb-qa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${QA_MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${QA_MINIO_ROOT_PASSWORD}"
      MINIO_APP_ACCESS_KEY: "${QA_MINIO_APP_ACCESS_KEY}"
      MINIO_APP_SECRET_KEY: "${QA_MINIO_APP_SECRET_KEY}"
      MINIO_BUCKET: qa-rag-documents
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set qa http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing "qa/$${MINIO_BUCKET}" >/dev/null
        mc anonymous set none "qa/$${MINIO_BUCKET}" >/dev/null
        mc admin user add qa "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}" >/dev/null
        cat > /tmp/qa-rag-policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::$${MINIO_BUCKET}"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::$${MINIO_BUCKET}/*"]}]}
        EOF
        mc admin policy create qa qa-rag-documents /tmp/qa-rag-policy.json >/dev/null 2>&1 || true
        mc admin policy attach qa qa-rag-documents --user "$${MINIO_APP_ACCESS_KEY}" >/dev/null
    networks:
      - qa-network

  flyway-mysql:
    image: resume-builder-flyway:13.3.0-mysql-26.7.0
    container_name: arb-qa-flyway-mysql
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: "jdbc:mysql://mysql:3306/${QA_MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      FLYWAY_USER: root
      FLYWAY_PASSWORD: "${QA_MYSQL_ROOT_PASSWORD}"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_LOCK_RETRY_COUNT: "50"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ../AI-Resume-Builder/sql/migrations/mysql:/flyway/sql:ro
    command: ["migrate"]
    networks:
      - qa-network

  flyway-pgvector:
    image: resume-builder-flyway:13.3.0-mysql-26.7.0
    container_name: arb-qa-flyway-pgvector
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      FLYWAY_URL: "jdbc:postgresql://pgvector:5432/${QA_POSTGRES_DB}"
      FLYWAY_USER: "${QA_POSTGRES_USER}"
      FLYWAY_PASSWORD: "${QA_POSTGRES_PASSWORD}"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_LOCK_RETRY_COUNT: "50"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ../AI-Resume-Builder/sql/migrations/postgresql:/flyway/sql:ro
    command: ["migrate"]
    networks:
      - qa-network

  qa-user-seed:
    image: mysql:8.4
    container_name: arb-qa-user-seed
    depends_on:
      flyway-mysql:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: "${QA_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${QA_MYSQL_DATABASE}"
      QA_RUN_ID: "${QA_RUN_ID}"
      QA_ADMIN_USERNAME: "${QA_ADMIN_USERNAME}"
      QA_ADMIN_PASSWORD: "${QA_ADMIN_PASSWORD}"
      QA_USER_USERNAME: "${QA_USER_USERNAME}"
      QA_USER_PASSWORD: "${QA_USER_PASSWORD}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        admin_hash=$$(printf '%s' "$${QA_ADMIN_PASSWORD}" | sha256sum | awk '{print $$1}')
        user_hash=$$(printf '%s' "$${QA_USER_PASSWORD}" | sha256sum | awk '{print $$1}')
        MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h mysql -uroot "$${MYSQL_DATABASE}" --execute="
          INSERT INTO auth_users (user_id, username, password_hash, display_name, role, permissions_json, enabled)
          VALUES
            ('qa-admin-$${QA_RUN_ID}', '$${QA_ADMIN_USERNAME}', '$${admin_hash}', 'QA 管理员', 'admin', JSON_ARRAY('resume_optimize','ai_interview','knowledge_admin'), 1),
            ('qa-user-$${QA_RUN_ID}', '$${QA_USER_USERNAME}', '$${user_hash}', 'QA 普通用户', 'user', JSON_ARRAY('resume_optimize','ai_interview'), 1)
          ON DUPLICATE KEY UPDATE password_hash=VALUES(password_hash), display_name=VALUES(display_name), role=VALUES(role), permissions_json=VALUES(permissions_json), enabled=1;"
        echo '隔离 QA 测试账号准备完成'
    networks:
      - qa-network

  backend:
    image: ai-resume-builder-python-ai-backend:latest
    container_name: arb-qa-backend
    depends_on:
      mock-ai:
        condition: service_healthy
      flyway-mysql:
        condition: service_completed_successfully
      flyway-pgvector:
        condition: service_completed_successfully
      qa-user-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8999"
      APP_AUTH_TOKEN_SECRET: "${QA_AUTH_TOKEN_SECRET}"
      APP_AUTH_TOKEN_TTL_SECONDS: "3600"
      APP_SYSTEM_CONFIG_ENCRYPTION_KEY: "${QA_SYSTEM_CONFIG_ENCRYPTION_KEY}"
      MYSQL_DATASOURCE_URL: "mysql+pymysql://root:${QA_MYSQL_ROOT_PASSWORD}@mysql:3306/${QA_MYSQL_DATABASE}"
      MYSQL_DATASOURCE_USERNAME: root
      MYSQL_DATASOURCE_PASSWORD: "${QA_MYSQL_ROOT_PASSWORD}"
      PGVECTOR_DATASOURCE_URL: "postgresql+psycopg://${QA_POSTGRES_USER}:${QA_POSTGRES_PASSWORD}@pgvector:5432/${QA_POSTGRES_DB}"
      PGVECTOR_DATASOURCE_USERNAME: "${QA_POSTGRES_USER}"
      PGVECTOR_DATASOURCE_PASSWORD: "${QA_POSTGRES_PASSWORD}"
      OPENAI_BASE_URL: http://mock-ai:8000
      OPENAI_API_KEY: "${QA_MOCK_API_KEY}"
      OPENAI_CHAT_BASE_URL: http://mock-ai:8000
      OPENAI_CHAT_API_KEY: "${QA_MOCK_API_KEY}"
      OPENAI_CHAT_COMPLETIONS_PATH: /v1/chat/completions
      OPENAI_CHAT_MODEL: mock-chat
      EMBEDDING_PROVIDER: openai
      OPENAI_EMBEDDING_BASE_URL: http://mock-ai:8000/v1
      OPENAI_EMBEDDING_API_KEY: "${QA_MOCK_API_KEY}"
      OPENAI_EMBEDDING_MODEL: text-embedding-3-large
      OPENAI_EMBEDDING_TIMEOUT_SECONDS: "10"
      VISION_PROVIDER: openai
      OPENAI_VISION_BASE_URL: http://mock-ai:8000
      OPENAI_VISION_API_KEY: "${QA_MOCK_API_KEY}"
      OPENAI_VISION_MODEL: mock-vision
      OPENAI_VISION_TIMEOUT_SECONDS: "10"
      RAG_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      RAG_OBJECT_STORAGE_BUCKET: qa-rag-documents
      RAG_OBJECT_STORAGE_ACCESS_KEY: "${QA_MINIO_APP_ACCESS_KEY}"
      RAG_OBJECT_STORAGE_SECRET_KEY: "${QA_MINIO_APP_SECRET_KEY}"
      RAG_OBJECT_STORAGE_REGION: us-east-1
      RAG_IMAGE_ENRICHMENT_REDIS_URL: redis://redis:6379/0
      RAG_IMAGE_ENRICHMENT_CONCURRENCY: "3"
      REALTIME_PROXY_TICKET_REDIS_URL: redis://redis:6379/0
      AUTOGEN_ENABLED: "false"
    ports:
      - "127.0.0.1:${QA_BACKEND_PORT:-18999}:8999"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8999/health', timeout=3)\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - qa-network

  frontend:
    image: arb-qa-frontend:local
    container_name: arb-qa-frontend
    build:
      context: ../AI-Resume-Builder
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      image-worker:
        condition: service_started
    ports:
      - "127.0.0.1:${QA_FRONTEND_PORT:-15173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - qa-network

  image-worker:
    image: ai-resume-builder-python-ai-backend:latest
    container_name: arb-qa-image-worker
    command: ["python", "-m", "app.worker_main"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SERVER_PORT: "8999"
      APP_AUTH_TOKEN_SECRET: "${QA_AUTH_TOKEN_SECRET}"
      APP_SYSTEM_CONFIG_ENCRYPTION_KEY: "${QA_SYSTEM_CONFIG_ENCRYPTION_KEY}"
      MYSQL_DATASOURCE_URL: "mysql+pymysql://root:${QA_MYSQL_ROOT_PASSWORD}@mysql:3306/${QA_MYSQL_DATABASE}"
      MYSQL_DATASOURCE_USERNAME: root
      MYSQL_DATASOURCE_PASSWORD: "${QA_MYSQL_ROOT_PASSWORD}"
      PGVECTOR_DATASOURCE_URL: "postgresql+psycopg://${QA_POSTGRES_USER}:${QA_POSTGRES_PASSWORD}@pgvector:5432/${QA_POSTGRES_DB}"
      PGVECTOR_DATASOURCE_USERNAME: "${QA_POSTGRES_USER}"
      PGVECTOR_DATASOURCE_PASSWORD: "${QA_POSTGRES_PASSWORD}"
      EMBEDDING_PROVIDER: openai
      OPENAI_EMBEDDING_BASE_URL: http://mock-ai:8000/v1
      OPENAI_EMBEDDING_API_KEY: "${QA_MOCK_API_KEY}"
      OPENAI_EMBEDDING_MODEL: text-embedding-3-large
      OPENAI_EMBEDDING_TIMEOUT_SECONDS: "10"
      VISION_PROVIDER: openai
      OPENAI_VISION_BASE_URL: http://mock-ai:8000
      OPENAI_VISION_API_KEY: "${QA_MOCK_API_KEY}"
      OPENAI_VISION_MODEL: mock-vision
      OPENAI_VISION_TIMEOUT_SECONDS: "10"
      RAG_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      RAG_OBJECT_STORAGE_BUCKET: qa-rag-documents
      RAG_OBJECT_STORAGE_ACCESS_KEY: "${QA_MINIO_APP_ACCESS_KEY}"
      RAG_OBJECT_STORAGE_SECRET_KEY: "${QA_MINIO_APP_SECRET_KEY}"
      RAG_OBJECT_STORAGE_REGION: us-east-1
      RAG_IMAGE_ENRICHMENT_REDIS_URL: redis://redis:6379/0
      RAG_IMAGE_ENRICHMENT_CONCURRENCY: "3"
      REALTIME_PROXY_TICKET_REDIS_URL: redis://redis:6379/0
    networks:
      - qa-network

networks:
  qa-network:
    name: arb-qa-network

volumes:
  qa-mysql-data:
    name: arb-qa-mysql-data
  qa-pgvector-data:
    name: arb-qa-pgvector-data
  qa-minio-data:
    name: arb-qa-minio-data
