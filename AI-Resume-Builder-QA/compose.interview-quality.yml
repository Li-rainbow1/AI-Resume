services:
  backend:
    command: ["uvicorn", "interview_capture:app", "--host", "0.0.0.0", "--port", "8999"]
    environment:
      APP_ENV: qa
      APP_INTERVIEW_CAPTURE_CONTEXT: "true"
      APP_INTERVIEW_RAG_TIMEOUT_SECONDS: "${APP_INTERVIEW_RAG_TIMEOUT_SECONDS:-30}"
      PYTHONPATH: /app:/qa-quality
      QA_INTERVIEW_CAPTURE_DIR: /qa-interview-captures
    volumes:
      - ./quality:/qa-quality:ro
      - ./reports/interview-captures:/qa-interview-captures
